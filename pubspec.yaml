name: portafolio_app
description: "Un nuevo proyecto de Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Librerias visuales
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  font_awesome_flutter: ^10.12.0
  url_launcher: ^6.3.2
  
  # Librerias de idioma
  flutter_localizations:
    sdk: flutter

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true
  generate: true 

  assets:
    - assets/img/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#959FA9"
  adaptive_icon_foreground: "assets/app_icon.png" 

flutter_native_splash:
  color: "#959FA9"
  image: "assets/splash_logo.png"
  android_12:
    image: "assets/splash_logo.png"
    color: "#959FA9"